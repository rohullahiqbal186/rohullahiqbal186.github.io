<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Four-class brain MRI classifier</title>
  <desc id="d">An MRI slice goes into a CNN, which assigns one of four labels: glioma, meningioma, pituitary tumor, or no tumor.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#4a5563"/>
    </marker>
  </defs>
  <rect x="20" y="78" width="140" height="140" rx="6" fill="#18202b"/>
  <ellipse cx="90" cy="148" rx="50" ry="58" fill="none" stroke="#9aa5b1" stroke-width="2"/>
  <ellipse cx="90" cy="148" rx="34" ry="42" fill="none" stroke="#74828f" stroke-width="1.5"/>
  <text x="90" y="240" text-anchor="middle" font-size="15" fill="#4a5563">MRI slice (schematic)</text>
  <g fill="none" stroke="#4a5563" stroke-width="1.5" marker-end="url(#a)">
    <path d="M168 148h44"/>
    <path d="M356 148c26 0 26-90 56-90"/>
    <path d="M356 148c26 0 26-30 56-30"/>
    <path d="M356 148c26 0 26 30 56 30"/>
    <path d="M356 148c26 0 26 90 56 90"/>
  </g>
  <rect x="216" y="108" width="140" height="80" rx="6" fill="#e9eef2" stroke="#2a55a0" stroke-width="1.5"/>
  <text x="286" y="144" text-anchor="middle" font-size="16" font-weight="600" fill="#18202b">CNN</text>
  <text x="286" y="164" text-anchor="middle" font-size="15" fill="#18202b">classifier</text>
  <g font-size="16" fill="#18202b">
    <text x="420" y="63">glioma</text>
    <text x="420" y="123">meningioma</text>
    <text x="420" y="183">pituitary tumor</text>
    <text x="420" y="243">no tumor</text>
  </g>
  <text x="20" y="290" font-size="14" fill="#4a5563">Schematic. Research project, not a clinical tool.</text>
</svg>
